server_name: katra-logto-admin
server_description: 'Machine-to-machine administration of a self-hosted, path-based
  multi-tenant Logto (Katra) deployment: bootstrap a tenant from scratch, link the
  product applications that consume it, issue and store credentials, provision the
  identity model, and operate sign-in, domains, connectors and configs. Credentials
  stay in the environment; secrets are never echoed.'
tools:
- name: katra_get_account_center
  description: Read the tenant's account center settings, which control the self-service
    profile page users see and which fields and actions it exposes. Returns the current
    configuration such as enabled state, profile fields, custom CSS and delete-account
    URL.
  parameters:
  - name: verbose
    type: boolean
    description: Set true to include the full expanded settings document in the response;
      defaults to false.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: ''
    api_name: ''
  return_type: string
  module: account-center
  ipc_type: null
  implementation_hint: ''
  generation_status: ready
  generation_notes: ''
  manual_steps: []
  impl:
    strategy: http_call
    cli_subcommand: ''
    cli_entry: ''
    python_module: ''
    python_function: ''
    python_import_path: ''
    python_class: ''
    python_init_params: []
    http_method: GET
    http_path: /api/account-center
    http_query_constants: {}
    grpc_service: ''
    grpc_method: ''
    grpc_proto_module: ''
    grpc_request_type: ''
    grpc_response_type: ''
    arg_mapping: {}
- name: katra_update_account_center
  description: Patch the tenant's account center settings; only the parameters supplied
    are changed, everything else stays as is. Use this to enable or disable the account
    center page, pick which profile fields render, brand it with custom CSS, or point
    the delete-account flow at an external URL. Returns the updated settings.
  parameters:
  - name: enabled
    type: boolean
    description: true to turn the account center page on, false to disable it for
      all users.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: enabled
  - name: fields
    type: object
    description: Object mapping account center field keys (for example name, avatar,
      email, phone, password, username) to their visibility or editability settings.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: fields
  - name: webauthnRelatedOrigins
    type: array
    description: Array of origins permitted to use passkeys/WebAuthn from this account
      center, given as full origin strings such as "https://example.com".
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: webauthnRelatedOrigins
  - name: deleteAccountUrl
    type: object
    description: Object describing the external account-deletion redirect, typically
      a url string and whether it is enabled.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: deleteAccountUrl
  - name: customCss
    type: string
    description: Raw CSS injected into the account center page to restyle it; send
      an empty string to remove existing custom CSS.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: customCss
  - name: profileFields
    type: array
    description: Array defining the ordered profile fields and their settings to expose
      in the account center; this replaces the existing list.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: profileFields
  - name: verbose
    type: boolean
    description: Set true to return the full expanded settings document in the response;
      defaults to false.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: ''
    api_name: ''
  return_type: string
  module: account-center
  ipc_type: null
  implementation_hint: ''
  generation_status: ready
  generation_notes: ''
  manual_steps: []
  impl:
