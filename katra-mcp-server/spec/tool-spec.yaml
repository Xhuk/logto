- name: katra_update_application
  description: Update an existing application; only the fields supplied are changed
    and the updated application is returned. Metadata and custom-data objects are
    replaced wholesale, so include every key that should remain.
  parameters:
  - name: id
    type: string
    description: Id of the application to update.
    required: true
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: path
    api_name: id
  - name: name
    type: string
    description: New display name for the application.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: name
  - name: description
    type: string
    description: New description; pass an empty string to clear it.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: description
  - name: oidcClientMetadata
    type: object
    description: Replacement OIDC settings object, e.g. {"redirectUris":[...],"corsAllowedOrigins":[...]};
      keys omitted here are reset to defaults.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: oidcClientMetadata
  - name: customClientMetadata
    type: object
    description: Replacement vendor-specific OIDC settings such as token TTLs; include
      all keys that should survive.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: customClientMetadata
  - name: customData
    type: object
    description: Replacement arbitrary JSON attached to the application.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: customData
  - name: appLevelAccessControlEnabled
    type: boolean
    description: Set true to enable per-application access control so roles can be
      scoped to this app.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: appLevelAccessControlEnabled
  - name: protectedAppMetadata
    type: object
    description: Replacement protected-app settings, e.g. {"origin":"https://example.com","subDomain":"app"};
      only meaningful for Protected apps.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: protectedAppMetadata
  - name: isAdmin
    type: boolean
    description: Set true to let this application administer the tenant (management
      privileges); handle with care.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: isAdmin
  - name: verbose
    type: boolean
    description: Return full payload when true.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: ''
    api_name: ''
  return_type: string
  module: applications
