# Config del redirector del 443 del tailnet para Katra.
#
# FUENTE DE VERDAD: este archivo. El compose lo monta desde el host en
#   /opt/katra-redirect/default.conf:/etc/nginx/conf.d/default.conf:ro
# Si el host se reconstruye, copiar este archivo a esa ruta (644) ANTES de levantar el stack,
# o el contenedor `redirect-admin` no arranca.
#
# Comportamiento:
#   - `/` (raíz del tailnet)  -> 302 a la Admin Console del tenant admin (:8443/console)
#   - todo lo demás           -> proxy al router multi-tenant (127.0.0.1:3001), que sirve
#                                cada producto en /<tenantId>/...  (p. ej. /5lkfax/console)
#
# El issuer OIDC (:8443/oidc) NO pasa por acá: sigue yendo directo de tailscale serve a :3002.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:3009;
    server_name _;
    server_tokens off;

    location = / {
        return 302 https://katra-imperial.tailfadff7.ts.net:8443/console;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}