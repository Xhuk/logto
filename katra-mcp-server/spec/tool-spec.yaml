- name: katra_create_application
  description: 'Create a new application (OIDC client) in the tenant and return it,
    including its generated id and client credentials. Side effect: a new client id
    and, for confidential types, a first client secret are issued.'
  parameters:
  - name: name
    type: string
    description: Human-readable display name for the application; required.
    required: true
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: name
  - name: description
    type: string
    description: Short description of what the application is for.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: description
  - name: type
    type: string
    description: Application type; one of Native, SPA, Traditional (server-side web),
      MachineToMachine, or Protected. Required.
    required: true
    default: null
    enum_values:
    - Native
    - SPA
    - Traditional
    - MachineToMachine
    - Protected
    - SAML
    properties: null
    original_type: null
    location: body
    api_name: type
  - name: oidcClientMetadata
    type: object
    description: OIDC settings, e.g. {"redirectUris":["https://app.example.com/callback"],"postLogoutRedirectUris":[],"corsAllowedOrigins":[]};
      sensible defaults are used for omitted keys.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: oidcClientMetadata
  - name: customClientMetadata
    type: object
    description: Extra OIDC behaviour such as {"idTokenTtl":3600,"refreshTokenTtlInDays":14,"alwaysIssueRefreshToken":false}.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: customClientMetadata
  - name: customData
    type: object
    description: Arbitrary JSON stored on the application and returned with it.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: customData
  - name: isThirdParty
    type: boolean
    description: Set true to mark the app as third-party so it is hidden from default
      listings; defaults to false.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: isThirdParty
  - name: protectedAppMetadata
    type: object
    description: Required when type is Protected, e.g. {"origin":"https://example.com","subDomain":"app","sessionDuration":3600}.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: body
    api_name: protectedAppMetadata
  - name: verbose
    type: boolean
    description: Return full payload when true.
    required: false
    default: null
    enum_values: null
    properties: null
    original_type: null
    location: ''
    api_name: ''
  return_type: string
  module: applications
  ipc_type: null
  implementation_hint: ''
  generation_status: ready
  generation_notes: ''
  manual_steps: []
  impl:
    strategy: http_call
    cli_subcommand: ''
    cli_entry: ''
    python_module: ''
    python_function: ''
    python_import_path: ''
    python_class: ''
    python_init_params: []
    http_method: POST
    http_path: /api/applications
    http_query_constants: {}
    grpc_service: ''
    grpc_method: ''
    grpc_proto_module: ''
    grpc_request_type: ''
    grpc_response_type: ''
