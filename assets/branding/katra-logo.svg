<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo Starfleet / Sci-fi Dark -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#151b28" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Gradiente Vulcano / Oro LCARS -->
    <linearGradient id="vulcanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27D" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#9E6812" />
    </linearGradient>

    <!-- Gradiente Núcleo de Energía / Katra -->
    <linearGradient id="katraCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BF0FF" />
      <stop offset="100%" stop-color="#1A78C2" />
    </linearGradient>

    <!-- Glow sutil del núcleo -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas redondeado para avatar de GitHub -->
  <rect width="500" height="500" rx="90" fill="url(#bgGlow)" stroke="#222f44" stroke-width="3"/>

  <!-- Emblema Principal: Fusión entre el Delta de Starfleet, la 'K' y el IDIC Vulcano -->
  <g transform="translate(0, -10)">
    <!-- Marco Exterior: Delta estilizado asimétrico -->
    <path d="M 250 85 
             L 345 285 
             L 285 260 
             L 250 330 
             L 155 285 Z" 
          fill="none" 
          stroke="url(#vulcanGold)" 
          stroke-width="14" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- La estructura interna que forma la 'K' geométrica -->
    <path d="M 215 175 L 215 315" 
          stroke="url(#vulcanGold)" 
          stroke-width="16" 
          stroke-linecap="round"/>
          
    <path d="M 215 245 L 285 175" 
          stroke="url(#vulcanGold)" 
          stroke-width="16" 
          stroke-linecap="round"/>
          
    <path d="M 235 225 L 290 315" 
          stroke="url(#vulcanGold)" 
          stroke-width="16" 
          stroke-linecap="round"/>

    <!-- Núcleo Katra: Joya/Chispa interior de identidad (Cyan Warp Core) -->
    <polygon points="250,215 268,245 250,275 232,245" 
             fill="url(#katraCore)" 
             filter="url(#coreGlow)"/>
  </g>

  <!-- Tipografía técnica minimalista -->
  <text x="250" y="405" 
        text-anchor="middle" 
        fill="#F0F4F8" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="9">KATRA</text>

  <text x="250" y="438" 
        text-anchor="middle" 
        fill="#E5A93C" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="5">IDENTITY PROVIDER</text>
</svg>
